plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	dependsOn 'verifyProjectHarness'
}

tasks.register('verifyProjectHarness') {
	group = 'verification'
	description = 'Verifies Questack project harness rules.'

	doLast {
		if (file('src/docs').exists()) {
			throw new GradleException('Generated documentation must live under docs/, not src/docs/.')
		}

		def restDocsPathOffenders = fileTree('src/test/java') {
			include '**/*.java'
		}.files.findAll { file ->
			file.text.contains('src/docs/api-docs')
		}

		if (!restDocsPathOffenders.isEmpty()) {
			throw new GradleException("REST Docs outputDir must be docs/api-docs: ${restDocsPathOffenders}")
		}
	}
}
